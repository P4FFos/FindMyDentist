image: maven:latest

stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository

before_script:
  - echo "Running Maven CI/CD pipeline..."

build:
  stage: build
  tags:
    - docker 
  script:
    - chmod +x mvnw
    - ./mvnw clean compile
