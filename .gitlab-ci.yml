image: maven:3.8.7-jdk-11

stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

image: maven:latest

cache:
  paths:
    - .m2/repository

before_script:
  - echo "Running Maven CI/CD pipeline..."

build:
  stage: build
  script:
    - ./mvnw clean compile

test:
  stage: test
  script:
    - mvn test