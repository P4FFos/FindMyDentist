image: node:20-alpine

# Cache modules in between jobs per-branch
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - config/node_modules/

stages:
  - build
  - test

build:
  stage: build
  tags:
    - docker
  script:
    - rm -rf node_modules/
    - npm install

test:
  stage: test
  tags:
    - docker
  services:
    - name: mvertes/alpine-mongo:latest
      alias: mongo
  variables:
    MONGODB_URI: "mongodb://localhost:27017/FindMyDentistTestDB"
  script:
    - npm install
    - cd services/patientService && npm install && cd ../..
    - npm run ci-test || exit 0
